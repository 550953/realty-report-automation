name: Infisical Sync

on:
  repository_dispatch:
    types: [sync-secrets]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Fetch secrets from Infisical
        id: infisical
        run: |
          INFISICAL_CLIENT_ID="${{ secrets.INFISICAL_CLIENT_ID }}"
          INFISICAL_CLIENT_SECRET="${{ secrets.INFISICAL_CLIENT_SECRET }}"
          PROJECT_ID="${{ secrets.INFISICAL_PROJECT_ID }}"
          ENVIRONMENT="${{ secrets.INFISICAL_ENVIRONMENT }}"

          # Получаем токен доступа
          AUTH_RESPONSE=$(curl -s -X POST "https://app.infisical.com/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"$INFISICAL_CLIENT_ID\", \"clientSecret\": \"$INFISICAL_CLIENT_SECRET\"}")

          if [ -z "$AUTH_RESPONSE" ]; then
            echo "❌ Ошибка: Не удалось получить ответ от Infisical (auth)"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$AUTH_RESPONSE" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              if (!data.accessToken) throw new Error('No accessToken in response');
              console.log(data.accessToken);
            } catch (e) {
              console.error('Ошибка парсинга токена:', e.message);
              process.exit(1);
            }
          ")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Ошибка: Пустой accessToken"
            exit 1
          fi

          # Запрашиваем секреты
          SECRETS_RESPONSE=$(curl -s -X GET "https://app.infisical.com/api/v1/projects/$PROJECT_ID/environments/$ENVIRONMENT/secrets" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json")

          if [ -z "$SECRETS_RESPONSE" ]; then
            echo "❌ Ошибка: Не удалось получить секреты из Infisical"
            exit 1
          fi

          # Сохраняем ответ для отладки (маскируем токены)
          echo "SECRETS_RESPONSE=$SECRETS_RESPONSE" >> $GITHUB_ENV

      - name: Parse and extract secrets
        id: parse-secrets
        run: |
          # Парсим JSON и извлекаем секреты
          RENDER_TOKEN=$(echo "$SECRETS_RESPONSE" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              console.log('Full response structure:', JSON.stringify(Object.keys(data)));
              
              // Пробуем разные структуры ответа
              let secretsArray = [];
              if (data.secrets) {
                secretsArray = data.secrets;
              } else if (data.data && data.data.secrets) {
                secretsArray = data.data.secrets;
              } else if (Array.isArray(data)) {
                secretsArray = data;
              } else {
                console.error('Не удалось найти массив секретов в ответе');
                process.exit(1);
              }
              
              const secret = secretsArray.find(s => s.key === 'RENDER_CLI_TOKEN_rinacohnbb9h4_realty');
              console.log(secret ? secret.value : '');
            } catch (e) {
              console.error('Ошибка парсинга:', e.message);
              process.exit(1);
            }
          ")
          
          SUPABASE_CP=$(echo "$SECRETS_RESPONSE" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              
              let secretsArray = [];
              if (data.secrets) {
                secretsArray = data.secrets;
              } else if (data.data && data.data.secrets) {
                secretsArray = data.data.secrets;
              } else if (Array.isArray(data)) {
                secretsArray = data;
              } else {
                console.error('Не удалось найти массив секретов в ответе');
                process.exit(1);
              }
              
              const secret = secretsArray.find(s => s.key === 'SUPABASE_CP_rinacohnbb9h4_realty');
              console.log(secret ? secret.value : '');
            } catch (e) {
              console.error('Ошибка парсинга:', e.message);
              process.exit(1);
            }
          ")

          if [ -n "$RENDER_TOKEN" ]; then
            echo "::add-mask::$RENDER_TOKEN"
            echo "RENDER_TOKEN_UPDATED=true" >> $GITHUB_ENV
          else
            echo "⚠️ RENDER_TOKEN не найден в Infisical"
          fi

          if [ -n "$SUPABASE_CP" ]; then
            echo "::add-mask::$SUPABASE_CP"
            echo "SUPABASE_CP_UPDATED=true" >> $GITHUB_ENV
          else
            echo "⚠️ SUPABASE_CP не найден в Infisical"
          fi

      - name: Log update status
        run: |
          echo "✅ RENDER_TOKEN обновлён: ${{ env.RENDER_TOKEN_UPDATED }}"
          echo "✅ SUPABASE_CP обновлён: ${{ env.SUPABASE_CP_UPDATED }}"
