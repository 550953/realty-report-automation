name: Infisical Sync

on:
  repository_dispatch:
    types: [sync-secrets]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanity-check required GH secrets are set
        run: |
          missing=0
          for name in INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET INFISICAL_PROJECT_ID INFISICAL_ENVIRONMENT; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "❌ GitHub secret $name пуст или не задан"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Проверь Settings → Secrets and variables → Actions в этом репозитории (550953/realty-report-automation)."
            exit 1
          fi
          echo "✅ Все нужные GH secrets присутствуют"
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ secrets.INFISICAL_ENVIRONMENT }}

      - name: Fetch + parse secrets (single script, no GITHUB_ENV JSON passing)
        id: infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          ENVIRONMENT: ${{ secrets.INFISICAL_ENVIRONMENT }}
        run: node .github/scripts/infisical-sync.js

      - name: Log update status
        run: |
          echo "========================================="
          echo "📊 Статус обновления секретов"
          echo "========================================="
          echo "RENDER_TOKEN обновлён: ${{ steps.infisical.outputs.render_token_updated == 'true' && '✅ Да' || '❌ Нет' }}"
          echo "SUPABASE_CP обновлён:  ${{ steps.infisical.outputs.supabase_cp_updated == 'true' && '✅ Да' || '❌ Нет' }}"
          echo "========================================="
