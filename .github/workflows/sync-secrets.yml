name: Infisical Sync

on:
  repository_dispatch:
    types: [sync-secrets]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch secrets from Infisical
        id: infisical
        run: |
          INFISICAL_CLIENT_ID="${{ secrets.INFISICAL_CLIENT_ID }}"
          INFISICAL_CLIENT_SECRET="${{ secrets.INFISICAL_CLIENT_SECRET }}"
          PROJECT_ID="${{ secrets.INFISICAL_PROJECT_ID }}"
          ENVIRONMENT="${{ secrets.INFISICAL_ENVIRONMENT }}"

          AUTH_RESPONSE=$(curl -s -X POST "https://app.infisical.com/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"$INFISICAL_CLIENT_ID\", \"clientSecret\": \"$INFISICAL_CLIENT_SECRET\"}")

          ACCESS_TOKEN=$(echo "$AUTH_RESPONSE" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
            console.log(data.accessToken);
          ")

          SECRETS_RESPONSE=$(curl -s -X GET "https://app.infisical.com/api/v1/projects/$PROJECT_ID/environments/$ENVIRONMENT/secrets" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json")

          echo "SECRETS_JSON=$SECRETS_RESPONSE" >> $GITHUB_ENV

      - name: Update GitHub Secrets
        if: success()
        run: |
          RENDER_TOKEN=$(echo "$SECRETS_JSON" | node -e "
            const secrets = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
            const secret = secrets.secrets.find(s => s.key === 'RENDER_CLI_TOKEN_rinacohnbb9h4_realty');
            console.log(secret ? secret.value : '');
          ")
          SUPABASE_CP=$(echo "$SECRETS_JSON" | node -e "
            const secrets = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
            const secret = secrets.secrets.find(s => s.key === 'SUPABASE_CP_rinacohnbb9h4_realty');
            console.log(secret ? secret.value : '');
          ")

          if [ -n "$RENDER_TOKEN" ]; then
            echo "::add-mask::$RENDER_TOKEN"
            echo "RENDER_TOKEN_UPDATED=true" >> $GITHUB_ENV
          fi
          if [ -n "$SUPABASE_CP" ]; then
            echo "::add-mask::$SUPABASE_CP"
            echo "SUPABASE_CP_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: Log update status
        run: |
          echo "RENDER_TOKEN updated: ${{ env.RENDER_TOKEN_UPDATED }}"
          echo "SUPABASE_CP updated: ${{ env.SUPABASE_CP_UPDATED }}"
