name: Infisical Sync

on:
  repository_dispatch:
    types: [sync-secrets]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch secrets from Infisical
        id: infisical
        run: |
          INFISICAL_CLIENT_ID="${{ secrets.INFISICAL_CLIENT_ID }}"
          INFISICAL_CLIENT_SECRET="${{ secrets.INFISICAL_CLIENT_SECRET }}"
          PROJECT_ID="${{ secrets.INFISICAL_PROJECT_ID }}"
          ENVIRONMENT="${{ secrets.INFISICAL_ENVIRONMENT }}"

          echo "🔐 Получаем токен доступа..."
          AUTH_RESPONSE=$(curl -s -X POST "https://app.infisical.com/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"$INFISICAL_CLIENT_ID\", \"clientSecret\": \"$INFISICAL_CLIENT_SECRET\"}")

          if [ -z "$AUTH_RESPONSE" ]; then
            echo "❌ Ошибка: Не удалось получить ответ от Infisical (auth)"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$AUTH_RESPONSE" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              if (!data.accessToken) throw new Error('No accessToken in response');
              console.log(data.accessToken);
            } catch (e) {
              console.error('Ошибка парсинга токена:', e.message);
              process.exit(1);
            }
          ")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Ошибка: Пустой accessToken"
            exit 1
          fi

          echo "✅ Токен получен, запрашиваем секреты..."

          # Используем ТОТ ЖЕ API, что и в Python-скрипте — /api/v3/secrets/raw
          SECRETS_RESPONSE=$(curl -s -X GET "https://app.infisical.com/api/v3/secrets/raw" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -G \
            --data-urlencode "workspaceId=$PROJECT_ID" \
            --data-urlencode "environment=$ENVIRONMENT" \
            --data-urlencode "include_imports=true" \
            --data-urlencode "secretPath=/")

          if [ -z "$SECRETS_RESPONSE" ]; then
            echo "❌ Ошибка: Не удалось получить секреты из Infisical"
            exit 1
          fi

          # Сохраняем для следующих шагов
          echo "SECRETS_JSON<<EOF" >> $GITHUB_ENV
          echo "$SECRETS_RESPONSE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "✅ Секреты получены, сохраняем в GITHUB_ENV"

      - name: Parse and extract secrets
        id: parse-secrets
        run: |
          echo "🔍 Парсим секреты из Infisical..."

          # Парсим ТОЧНО так же, как в Python-скрипте:
          # data.secrets — массив, у каждого элемента есть secretKey и secretValue
          RENDER_TOKEN=$(echo "$SECRETS_JSON" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              
              // Проверяем структуру как в Python-скрипте
              if (!data.secrets || !Array.isArray(data.secrets)) {
                console.error('❌ Нет массива secrets в ответе');
                console.error('Ключи ответа:', Object.keys(data));
                process.exit(1);
              }
              
              console.log('✅ Найдено секретов:', data.secrets.length);
              
              // Ищем по secretKey (как в Python: s['secretKey'])
              const secret = data.secrets.find(s => s.secretKey === 'RENDER_CLI_TOKEN_rinacohnbb9h4_realty');
              console.log(secret ? secret.secretValue : '');
            } catch (e) {
              console.error('❌ Ошибка парсинга RENDER_TOKEN:', e.message);
              process.exit(1);
            }
          ")

          SUPABASE_CP=$(echo "$SECRETS_JSON" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              
              if (!data.secrets || !Array.isArray(data.secrets)) {
                console.error('❌ Нет массива secrets в ответе');
                console.error('Ключи ответа:', Object.keys(data));
                process.exit(1);
              }
              
              const secret = data.secrets.find(s => s.secretKey === 'SUPABASE_CP_rinacohnbb9h4_realty');
              console.log(secret ? secret.secretValue : '');
            } catch (e) {
              console.error('❌ Ошибка парсинга SUPABASE_CP:', e.message);
              process.exit(1);
            }
          ")

          # Выводим найденные значения (маскируем)
          if [ -n "$RENDER_TOKEN" ]; then
            echo "::add-mask::$RENDER_TOKEN"
            echo "RENDER_TOKEN_UPDATED=true" >> $GITHUB_ENV
            echo "✅ RENDER_TOKEN найден (замаскирован)"
          else
            echo "⚠️ RENDER_TOKEN не найден в Infisical"
          fi

          if [ -n "$SUPABASE_CP" ]; then
            echo "::add-mask::$SUPABASE_CP"
            echo "SUPABASE_CP_UPDATED=true" >> $GITHUB_ENV
            echo "✅ SUPABASE_CP найден (замаскирован)"
          else
            echo "⚠️ SUPABASE_CP не найден в Infisical"
          fi

      - name: Show all secret names (без значений)
        run: |
          echo "📋 Список всех ключей секретов в Infisical:"
          echo "$SECRETS_JSON" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              if (data.secrets && Array.isArray(data.secrets)) {
                console.log('Всего секретов:', data.secrets.length);
                data.secrets.forEach(s => {
                  console.log('  -', s.secretKey);
                });
              } else {
                console.log('❌ Не удалось получить список секретов');
              }
            } catch (e) {
              console.error('Ошибка:', e.message);
            }
          "

      - name: Log update status
        run: |
          echo "========================================="
          echo "📊 Статус обновления секретов"
          echo "========================================="
          echo "RENDER_TOKEN обновлён: ${{ env.RENDER_TOKEN_UPDATED == 'true' && '✅ Да' || '❌ Нет' }}"
          echo "SUPABASE_CP обновлён:  ${{ env.SUPABASE_CP_UPDATED == 'true' && '✅ Да' || '❌ Нет' }}"
          echo "========================================="
